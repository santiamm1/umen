<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | UMEN</title>
    <link rel="icon" href="assets/Logo/Favicon.png">
    <link rel="stylesheet" href="css/styles.css?v=1.2">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase CDN -->
    <script type="module">
        import { firebaseConfig } from './js/config.js';
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js';
        import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js';
        import { getFirestore } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js';
        import { getStorage } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-storage.js';

        const app = initializeApp(firebaseConfig);
        window.auth = getAuth(app);
        window.db = getFirestore(app);
        window.storage = getStorage(app);
    </script>
</head>

<body>
    <header id="header">
        <div class="container header-content">
            <div class="logo-container">
                <img src="assets/Logo/Logo.png" alt="UMEN Logo" class="logo">
            </div>
            <nav>
                <a href="index.html">Ver Sitio</a>
                <button id="logout-btn" class="btn-secondary btn-sm">Cerrar Sesión</button>
            </nav>
        </div>
    </header>

    <main class="container admin-main">
        <div class="admin-header">
            <h1>Panel de Control</h1>
            <button id="new-property-btn" class="btn-primary"><i class="fas fa-plus"></i> Nueva Propiedad</button>
        </div>

        <div class="admin-stats">
            <div class="stat-card">
                <h3 id="total-properties">0</h3>
                <p>Propiedades Activas</p>
            </div>
            <div class="stat-card">
                <h3 id="total-venta">0</h3>
                <p>En Venta</p>
            </div>
            <div class="stat-card">
                <h3 id="total-alquiler">0</h3>
                <p>En Alquiler</p>
            </div>
        </div>

        <div class="admin-content-card">
            <div class="card-header">
                <h2>Mis Propiedades</h2>
                <div class="search-box">
                    <input type="text" id="admin-search" placeholder="Buscar por título...">
                </div>
            </div>
            <div class="table-responsive">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Propiedad</th>
                            <th>Operación</th>
                            <th>Precio</th>
                            <th>Ubicación</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="properties-tbody">
                        <tr>
                            <td colspan="5" class="text-center">Cargando propiedades...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal para Nueva/Editar Propiedad -->
    <div id="property-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Nueva Propiedad</h2>
                <button class="close-modal">&times;</button>
            </div>
            <form id="property-form">
                <div class="modal-body">
                    <div class="form-grid">
                        <div class="form-group full-width">
                            <label for="title">Título de la Propiedad</label>
                            <input type="text" id="title" required>
                        </div>
                        <div class="form-group">
                            <label for="price">Precio (Solo números)</label>
                            <input type="number" id="price" required>
                        </div>
                        <div class="form-group">
                            <label for="currency">Moneda</label>
                            <select id="currency">
                                <option value="USD">USD</option>
                                <option value="ARS">ARS</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="type">Tipo</label>
                            <select id="type">
                                <option value="Departamentos">Departamento</option>
                                <option value="Casas">Casa</option>
                                <option value="Oficinas">Oficina</option>
                                <option value="Lotes">Lote/Terreno</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="operation">Operación</label>
                            <select id="operation">
                                <option value="venta">Venta</option>
                                <option value="alquiler">Alquiler</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="neighborhood">Barrio</label>
                            <input type="text" id="neighborhood" required>
                        </div>
                        <div class="form-group">
                            <label for="zone">Zona / Localidad</label>
                            <input type="text" id="zone" required>
                        </div>
                        <div class="form-group">
                            <label for="surface">Superficie Total (m²)</label>
                            <input type="number" id="surface" required>
                        </div>
                        <div class="form-group">
                            <label for="bedrooms">Ambientes</label>
                            <input type="number" id="bedrooms" required>
                        </div>
                        <div class="form-group full-width">
                            <label for="description">Descripción</label>
                            <textarea id="description" rows="4"></textarea>
                        </div>
                        <div class="form-group full-width">
                            <div id="image-url-list" style="display:flex;flex-direction:column;gap:16px;margin-bottom:12px"></div>
                            <button type="button" class="btn-secondary btn-sm" id="add-image-btn" style="width:fit-content">
                                <i class="fas fa-plus"></i> Agregar foto
                            </button>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-secondary close-modal">Cancelar</button>
                    <button type="submit" class="btn-primary">Guardar Propiedad</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="js/adminDashboard.js?v=3.0"></script>
</body>

</html>

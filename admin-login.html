<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Admin | UMEN Real Estate</title>
    <link rel="icon" href="assets/Logo/Favicon.png">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase CDN -->
    <script type="module">
        import { firebaseConfig } from './js/config.js';
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js';
        import { getFirestore } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js';
        import { getStorage } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-storage.js';

        const app = initializeApp(firebaseConfig);
        window.auth = getAuth(app);
        window.db = getFirestore(app);
        window.storage = getStorage(app);
    </script>
</head>
<body>
    <main class="login-container">
        <div class="login-form-card">
            <img src="https://umen.com.ar/wp-content/uploads/2021/02/UMEN-logo.png" alt="UMEN Logo" class="logo">
            <h2>Acceso Administrativo</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" placeholder="admin@umen.com.ar" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primary full-width">Ingresar al Sistema</button>
            </form>
            <p id="error-message" style="color: #ff6b6b; margin-top: 15px; font-weight: 600; font-size: 0.9rem;"></p>
            <a href="index.html" style="display: block; margin-top: 25px; color: rgba(255,255,255,0.6); font-size: 0.85rem; text-decoration: none; font-weight: 600; transition: color 0.2s;"><i class="fas fa-arrow-left"></i> Volver al sitio web</a>
        </div>
    </main>

    <script type="module" src="js/adminLogin.js"></script>
</body>
</html>

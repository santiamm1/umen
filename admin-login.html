<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Admin | UMEN Real Estate</title>
    <link rel="icon" href="assets/Logo/Favicon.png">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase CDN -->
    <script type="module">
        import { firebaseConfig } from './js/config.js';
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js';
        import { getFirestore } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js';
        import { getStorage } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-storage.js';

        const app = initializeApp(firebaseConfig);
        window.auth = getAuth(app);
        window.db = getFirestore(app);
        window.storage = getStorage(app);
    </script>
</head>
<body>
    <header id="header">
        <div class="container header-content">
            <div class="logo-container">
                <img src="assets/Logo/Logo.png" alt="UMEN Logo" class="logo">
            </div>
            <nav>
                <a href="index.html">Propiedades</a>
            </nav>
        </div>
    </header>

    <main class="login-container">
        <div class="login-form-card">
            <h2>Acceso Administrativo</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" placeholder="admin@umen.com.ar" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primary full-width">Ingresar al Sistema</button>
            </form>
            <p id="error-message" style="color: #e42b2b;"></p>
        </div>
    </main>

    <footer id="footer">
        <div class="container">
            <p>&copy; 2024 UMEN. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script type="module" src="js/adminLogin.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | UMEN Buenos Negocios Inmobiliarios</title>
    <link rel="icon" href="assets/Logo/Favicon.png">
    <link rel="stylesheet" href="css/styles.css?v=13.8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase CDN -->
    <script type="module">
        import { firebaseConfig } from './js/config.js';
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js';
        import { getAuth }       from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js';
        import { getFirestore }  from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js';
        import { getStorage }    from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-storage.js';

        const app = initializeApp(firebaseConfig);
        window.auth    = getAuth(app);
        window.db      = getFirestore(app);
        window.storage = getStorage(app);
    </script>
</head>
<body>

    <div id="header-placeholder"></div>

    <!-- Page hero -->
    <section class="prop-page-hero">
        <div class="prop-hero-bg" style="background-image: url('https://images.unsplash.com/photo-1497366754035-f200968a6e72?ixlib=rb-4.0.3&auto=format&fit=crop&w=1800&q=80');"></div>
        <div class="hero-overlay-content">
            <div class="hero-inner">
                <nav class="breadcrumb prop-breadcrumb">
                    <a href="/">Inicio</a>
                    <i class="fas fa-chevron-right"></i>
                    <span>Noticias</span>
                </nav>
                <span class="hero-eyebrow">Notas & Urbanismo · UMEN</span>
                <h1>Novedades del<br>mercado inmobiliario</h1>
                <p class="hero-subtitle">Tendencias, urbanismo y análisis de zona para tomar mejores decisiones.</p>
            </div>
        </div>
    </section>

    <main class="main-layout">
        <div class="container">
            <div class="blog-toolbar">
                <div class="blog-toolbar-search">
                    <i class="fas fa-search"></i>
                    <input type="text" id="blog-search" placeholder="Buscar notas...">
                </div>
                <div class="blog-toolbar-filters">
                    <select id="blog-category-filter">
                        <option value="">Todas las categorías</option>
                    </select>
                    <select id="blog-sort">
                        <option value="desc">Más recientes</option>
                        <option value="asc">Más antiguas</option>
                    </select>
                </div>
            </div>
            <div class="items-container" id="blog-list">
                <div class="loader"><i class="fas fa-spinner fa-spin"></i> Cargando notas...</div>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script type="module" src="js/blog.js"></script>
    <script type="module">
        import { loadHeader, loadFooter } from './js/components.js';
        loadHeader();
        loadFooter();
    </script>
</body>
</html>

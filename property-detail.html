<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Propiedad | UMEN Real Estate</title>
    <link rel="icon" href="assets/Logo/Favicon.png">
    <link rel="stylesheet" href="css/styles.css?v=1.2">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase CDN -->
    <script type="module">
        import { firebaseConfig } from './js/config.js';
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js';
        import { getAuth } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js';
        import { getFirestore } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js';
        import { getStorage } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-storage.js';

        const app = initializeApp(firebaseConfig);
        window.auth = getAuth(app);
        window.db = getFirestore(app);
        window.storage = getStorage(app);
    </script>
</head>
<body>
    <header id="header">
        <div class="container header-content">
            <div class="logo-container">
                <img src="assets/Logo/Logo.png" alt="UMEN Logo" class="logo">
            </div>
            <nav>
                <a href="index.html">Propiedades</a>
                <a href="admin-login.html">Acceso Admin</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            <div id="property-detail">
                <!-- Property detail will be populated by JS -->
            </div>
        </div>
    </main>

    <footer id="footer">
        <div class="container">
            <p>&copy; 2024 UMEN. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script type="module" src="js/propertyDetail.js?v=1.2"></script>

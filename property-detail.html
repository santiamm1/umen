<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Propiedad | UMEN Buenos Negocios Inmobiliarios</title>
    <link rel="icon" href="assets/Logo/Favicon.png">
    <link rel="stylesheet" href="css/styles.css?v=13.8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase CDN -->
    <script type="module">
        import { firebaseConfig } from './js/config.js';
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js';
        import { getAuth }       from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js';
        import { getFirestore }  from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js';
        import { getStorage }    from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-storage.js';

        const app = initializeApp(firebaseConfig);
        window.auth    = getAuth(app);
        window.db      = getFirestore(app);
        window.storage = getStorage(app);
    </script>
</head>
<body class="page-with-filter-toggle">

    <!-- Header (siempre sólido en páginas internas) -->
    <div id="header-placeholder"></div>

    <!-- Contenido principal -->
    <main>
        <div class="container">
            <div id="property-detail">
                <div class="loader"><i class="fas fa-spinner fa-spin"></i> Cargando propiedad...</div>
            </div>
        </div>
    </main>

    <!-- Footer completo -->
    <div id="footer-placeholder"></div>

    <script type="module" src="js/propertyDetail.js?v=3.4"></script>
    <script type="module">
        import { loadHeader, loadFooter } from './js/components.js';
        loadHeader();
        loadFooter();
    </script>
</body>
</html>

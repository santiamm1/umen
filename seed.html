<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cargador de Datos - UMEN</title>
    <style>
        body { font-family: sans-serif; padding: 40px; text-align: center; }
        .btn { background: #FF7F00; color: white; border: none; padding: 15px 30px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        #status { margin-top: 20px; color: #666; }
    </style>
</head>
<body>
    <h1>Cargador de Propiedades para UMEN</h1>
    <p>Este script cargará 3 propiedades de prueba en tu Firebase.</p>
    <button id="seed-btn" class="btn">Cargar Propiedades Ahora</button>
    <div id="status"></div>

    <script type="module">
        import { firebaseConfig } from './js/config.js';
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js';
        import { getFirestore, collection, addDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js';

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const properties = [
            {
                title: 'Oficina Premium Av. Cabildo 4769',
                price: 1490000,
                currency: 'ARS',
                type: 'Oficinas',
                operation: 'alquiler',
                neighborhood: 'Nuñez',
                zone: 'Capital Federal',
                province: 'bsas',
                surface: 60,
                bedrooms: 0,
                bathrooms: 1,
                description: 'Impecable oficina muy luminosa y silenciosa. 60 M2. Ubicación privilegiada en el corazón de Nuñez.',
                images: ['https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&w=1200&q=80'],
                createdAt: serverTimestamp()
            },
            {
                title: 'Casona Ideal Geriátrico / Hospedaje - La Plata',
                price: 330000,
                currency: 'USD',
                type: 'Casas',
                operation: 'venta',
                neighborhood: 'La Plata',
                zone: 'La Plata',
                province: 'bsas',
                surface: 450,
                bedrooms: 13,
                bathrooms: 6,
                description: 'Casona Ideal para geriátrico / hospedaje. Ubicada sobre avenida 44. 13 habitaciones, quincho, cocina, lavadero y patios.',
                images: ['https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=1200&q=80'],
                createdAt: serverTimestamp()
            },
            {
                title: 'Monoambiente Impecable Belgrano - Arcos 2366',
                price: 750000,
                currency: 'ARS',
                type: 'Departamentos',
                operation: 'alquiler',
                neighborhood: 'Belgrano',
                zone: 'Capital Federal',
                province: 'bsas',
                surface: 35,
                bedrooms: 1,
                bathrooms: 1,
                description: 'Monoambiente. Piso dos al frente IMPECABLE! Excelente ubicación en el barrio de Belgrano.',
                images: ['https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?auto=format&fit=crop&w=1200&q=80'],
                createdAt: serverTimestamp()
            }
        ];

        document.getElementById('seed-btn').addEventListener('click', async () => {
            const status = document.getElementById('status');
            status.textContent = 'Cargando...';
            
            try {
                for (const prop of properties) {
                    await addDoc(collection(db, 'properties'), prop);
                }
                status.textContent = '✅ ¡3 Propiedades cargadas con éxito! Ya puedes verlas en tu sitio.';
                status.style.color = 'green';
            } catch (error) {
                console.error(error);
                status.textContent = '❌ Error: ' + error.message + '. Asegúrate de haber configurado las reglas de Firebase.';
                status.style.color = 'red';
            }
        });
    </script>
</body>
</html>
